<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>KA27Cart</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
font-family:Arial,sans-serif;
background:#f4f7f6;
color:#14201c;
padding-bottom:85px
}
button,input{font:inherit}
button{cursor:pointer;border:0}
.header{
background:#079447;
color:white;
padding:18px 18px 22px;
border-radius:0 0 24px 24px
}
.top{
display:flex;
justify-content:space-between;
align-items:center
}
.logo{
font-size:27px;
font-weight:bold
}
.location{font-size:14px;margin-top:5px}
.cartBtn{
background:white;color:#078c45;
width:55px;height:55px;
border-radius:50%;
font-size:25px;
position:relative
}
.badge{
position:absolute;
right:-2px;top:-5px;
background:#ffd329;color:#111;
font-size:13px;
font-weight:bold;
padding:7px 9px;
border-radius:50%
}
.search{
margin-top:18px;
background:white;
border:0;
border-radius:18px;
padding:15px;
width:100%;
font-size:16px;
outline:none
}
.container{padding:20px 16px}
.banner{
background:linear-gradient(135deg,#126b45,#079447);
color:white;
padding:28px;
border-radius:22px;
margin-bottom:24px
}
.banner h1{font-size:30px;margin-bottom:10px}
.banner p{font-size:17px;line-height:1.5;margin-bottom:20px}
.primary{
background:white;
color:#078c45;
padding:14px 20px;
border-radius:15px;
font-weight:bold
}
.sectionTitle{
display:flex;
justify-content:space-between;
align-items:center;
margin:20px 4px 14px;
font-size:22px
}
.green{color:#078c45;font-weight:bold;font-size:15px}
.aiBox{
background:white;border-radius:22px;
padding:20px;
box-shadow:0 3px 15px #0000000d
}
.aiBox p{color:#777;margin:10px 0 18px}
.chips{
display:flex;gap:10px;
overflow:auto
}
.chip{
white-space:nowrap;
background:white;border:1px solid #ddd;
padding:11px 16px;border-radius:25px
}
.categories{
display:grid;
grid-template-columns:1fr 1fr;
gap:14px
}
.category{
background:white;
padding:22px 12px;
border-radius:20px;
text-align:center;
box-shadow:0 2px 10px #0000000b
}
.category .emoji{font-size:40px}
.category h3{margin:10px 0 5px}
.category p{color:#777;font-size:13px}
.products{
display:grid;
grid-template-columns:1fr 1fr;
gap:14px
}
.product{
background:white;border-radius:18px;
padding:12px;
box-shadow:0 2px 10px #0000000b
}
.productImg{
height:125px;
border-radius:14px;
background:#f1f5f3;
display:flex;
align-items:center;
justify-content:center;
font-size:55px
}
.product h3{
font-size:16px;
margin:10px 0 5px
}
.product .price{
font-size:18px;
font-weight:bold
}
.old{
color:#999;text-decoration:line-through;
font-size:12px;margin-left:4px
}
.add{
width:100%;
background:#079447;
color:white;
padding:10px;
border-radius:12px;
margin-top:10px;
font-weight:bold
}
.pageTitle{
font-size:30px;
margin-bottom:20px
}
.card{
background:white;
border-radius:20px;
padding:20px;
margin-bottom:15px
}
.cartItem{
display:flex;
gap:12px;
align-items:center;
padding:12px 0;
border-bottom:1px solid #eee
}
.cartEmoji{
width:60px;height:60px;
background:#f1f5f3;
border-radius:14px;
display:flex;
align-items:center;
justify-content:center;
font-size:30px
}
.qty{
display:flex;
align-items:center;
gap:8px;
margin-top:7px
}
.qty button{
width:30px;height:30px;
border-radius:8px;
background:#e8f5ee;
color:#078c45;
font-weight:bold
}
.total{
display:flex;
justify-content:space-between;
font-size:20px;
font-weight:bold;
padding:15px 0
}
.checkout{
width:100%;
background:#079447;
color:white;
padding:16px;
border-radius:14px;
font-weight:bold
}
.order{
background:white;
border-radius:20px;
padding:20px;
margin-bottom:15px
}
.orderStatus{color:#078c45;font-weight:bold;margin-top:10px}
.profile{
background:white;
border-radius:22px;
padding:25px;
text-align:center
}
.avatar{font-size:75px}
.field{
width:100%;
padding:15px;
border:1px solid #ddd;
border-radius:14px;
margin-top:12px;
outline:none
}
.save{
background:#079447;
color:white;
padding:14px 22px;
border-radius:14px;
font-weight:bold;
margin-top:14px
}
.bottom{
position:fixed;
bottom:0;
left:0;
right:0;
height:80px;
background:white;
display:flex;
justify-content:space-around;
align-items:center;
box-shadow:0 -3px 15px #0002;
z-index:20
}
.nav{
background:none;
color:#777;
font-size:12px;
text-align:center
}
.nav span{display:block;font-size:27px}
.nav.active{color:#078c45;font-weight:bold}
.modal{
display:none;
position:fixed;
inset:0;
background:#0008;
z-index:50;
align-items:flex-end
}
.modalBox{
background:white;
width:100%;
border-radius:25px 25px 0 0;
padding:25px;
max-height:85vh;
overflow:auto
}
.close{
float:right;
background:#eee;
width:35px;height:35px;
border-radius:50%
}
.aiFloat{
position:fixed;
right:18px;
bottom:95px;
width:58px;height:58px;
border-radius:50%;
background:#111;
color:white;
font-size:28px;
z-index:25
}
.chat{
height:300px;
overflow:auto;
background:#f5f5f5;
border-radius:15px;
padding:12px;
margin:15px 0
}
.msg{
padding:10px 13px;
border-radius:15px;
margin:7px 0;
max-width:85%
}
.bot{background:white}
.user{background:#079447;color:white;margin-left:auto}
.chatInput{display:flex;gap:8px}
.chatInput input{flex:1;padding:13px;border:1px solid #ddd;border-radius:13px}
.chatInput button{background:#079447;color:white;padding:13px;border-radius:13px}
.empty{text-align:center;color:#777;padding:60px 20px}
@media(min-width:700px){
.container{max-width:850px;margin:auto}
.products{grid-template-columns:repeat(4,1fr)}
.categories{grid-template-columns:repeat(4,1fr)}
.bottom{max-width:850px;left:50%;transform:translateX(-50%)}
}
</style>
</head>

<body>

<div id="app"></div>

<div class="bottom">
<button class="nav active" onclick="showPage('home')" id="n-home">
<span>🏠</span>Home
</button>
<button class="nav" onclick="showPage('categories')" id="n-categories">
<span>📁</span>Categories
</button>
<button class="nav" onclick="showPage('cart')" id="n-cart">
<span>🛒</span>Cart
</button>
<button class="nav" onclick="showPage('orders')" id="n-orders">
<span>📦</span>Orders
</button>
<button class="nav" onclick="showPage('profile')" id="n-profile">
<span>👤</span>Profile
</button>
</div>

<button class="aiFloat" onclick="openAI()">🤖</button>

<div class="modal" id="modal" onclick="closeModal(event)">
<div class="modalBox" id="modalContent"></div>
</div>

<script>
const products=[
{id:1,name:"Premium Rice",cat:"Grocery",price:499,old:550,emoji:"🍚"},
{id:2,name:"Toor Dal",cat:"Grocery",price:159,old:180,emoji:"🫘"},
{id:3,name:"Cooking Oil",cat:"Grocery",price:145,old:165,emoji:"🫗"},
{id:4,name:"Sugar 5 KG",cat:"Grocery",price:240,old:270,emoji:"🍬"},
{id:5,name:"Men T-Shirt",cat:"Fashion",price:399,old:499,emoji:"👕"},
{id:6,name:"Ladies Dress",cat:"Fashion",price:699,old:799,emoji:"👗"},
{id:7,name:"Running Shoes",cat:"Footwear",price:899,old:1099,emoji:"👟"},
{id:8,name:"School Bag",cat:"Stationery",price:499,old:599,emoji:"🎒"},
{id:9,name:"Notebook",cat:"Stationery",price:59,old:70,emoji:"📓"},
{id:10,name:"Headphones",cat:"Electronics",price:799,old:999,emoji:"🎧"},
{id:11,name:"Smart Watch",cat:"Electronics",price:1299,old:1599,emoji:"⌚"},
{id:12,name:"Mobile Charger",cat:"Electronics",price:349,old:399,emoji:"🔌"}
];

let cart=JSON.parse(localStorage.getItem("ka27cart")||"[]");
let orders=JSON.parse(localStorage.getItem("ka27orders")||"[]");
let profile=JSON.parse(localStorage.getItem("ka27profile")||'{"name":"Sabir","phone":"","address":"Bankapur Shah Bazar"}');

function save(){
localStorage.setItem("ka27cart",JSON.stringify(cart));
localStorage.setItem("ka27orders",JSON.stringify(orders));
}

function cartCount(){
return cart.reduce((a,b)=>a+b.qty,0)
}

function money(n){
return "₹"+n
}

function header(){
return `
<div class="header">
<div class="top">
<div>
<div class="logo">🛒 KA27Cart</div>
<div class="location">📍 Bankapur • Haveri</div>
</div>
<button class="cartBtn" onclick="showPage('cart')">
🛒 <b class="badge">${cartCount()}</b>
</button>
</div>
<input class="search" id="search" placeholder="🔎 Search products, categories..." oninput="searchProducts(this.value)">
</div>`
}

function home(){
return `
${header()}
<div class="container">

<div class="banner">
<h1>Fast, Smart & Local Shopping</h1>
<p>Shop everyday products from one simple app.</p>
<button class="primary" onclick="showPage('categories')">Explore Categories</button>
</div>

<div class="sectionTitle">
<span>KA27 AI 🤖</span>
</div>

<div class="aiBox">
<h3>Need help finding something?</h3>
<p>Ask KA27 AI for product or shopping help.</p>
<div class="chips">
<button class="chip" onclick="aiQuestion('Best budget products')">Best budget picks</button>
<button class="chip" onclick="aiQuestion('Grocery help')">Grocery help</button>
<button class="chip" onclick="aiQuestion('Best products')">Best products</button>
</div>
</div>

<div class="sectionTitle">
<span>Categories</span>
<button class="green" onclick="showPage('categories')">See all</button>
</div>

<div class="categories">
${categoryCard("🛒","Grocery","Rice, dal, oil and more")}
${categoryCard("👕","Fashion","Clothes and style")}
${categoryCard("👟","Footwear","Shoes and slippers")}
${categoryCard("📱","Electronics","Useful gadgets")}
</div>

<div class="sectionTitle"><span>Popular Products</span></div>
<div class="products">${products.slice(0,6).map(productCard).join("")}</div>

</div>`
}

function categoryCard(e,n,d){
return `<div class="category" onclick="filterCat('${n}')">
<div class="emoji">${e}</div><h3>${n}</h3><p>${d}</p>
</div>`
}

function productCard(p){
return `
<div class="product">
<div class="productImg">${p.emoji}</div>
<h3>${p.name}</h3>
<small>${p.cat}</small>
<div class="price">${money(p.price)} <span class="old">${money(p.old)}</span></div>
<button class="add" onclick="addCart(${p.id})">+ Add to Cart</button>
</div>`
}

function categories(){
return `
${header()}
<div class="container">
<h1 class="pageTitle">Categories</h1>

<div class="categories">
${categoryCard("🛒","Grocery","Daily essentials")}
${categoryCard("👕","Fashion","Men & women")}
${categoryCard("👟","Footwear","Shoes & sandals")}
${categoryCard("📱","Electronics","Gadgets")}
${categoryCard("📚","Stationery","School items")}
</div>

<div class="sectionTitle"><span>All Products</span></div>
<div class="products">${products.map(productCard).join("")}</div>
</div>`
}

function cartPage(){
if(!cart.length){
return `${header()}<div class="container">
<h1 class="pageTitle">🛒 My Cart</h1>
<div class="card empty">
<div style="font-size:55px">🛒</div>
<h2>Cart abhi empty hai.</h2>
<p>Add products to continue shopping.</p>
</div></div>`
}

let total=0;
let html=cart.map(item=>{
let p=products.find(x=>x.id==item.id);
let sub=p.price*item.qty;
total+=sub;
return `
<div class="cartItem">
<div class="cartEmoji">${p.emoji}</div>
<div style="flex:1">
<b>${p.name}</b>
<div>${money(p.price)}</div>
<div class="qty">
<button onclick="changeQty(${p.id},-1)">−</button>
<b>${item.qty}</b>
<button onclick="changeQty(${p.id},1)">+</button>
<button onclick="removeCart(${p.id})">🗑️</button>
</div>
</div>
<b>${money(sub)}</b>
</div>`
}).join("");

return `${header()}<div class="container">
<h1 class="pageTitle">🛒 My Cart</h1>
<div class="card">${html}
<div class="total"><span>Total</span><span>${money(total)}</span></div>
<button class="checkout" onclick="checkout()">Place Order • ${money(total)}</button>
</div></div>`
}

function ordersPage(){
let html=orders.length?
orders.map(o=>`
<div class="order">
<div style="display:flex;justify-content:space-between">
<b>Order #${o.id}</b>
<span>${o.date}</span>
</div>
<h3 style="margin-top:15px">💰 Total: ${money(o.total)}</h3>
<div class="orderStatus">✅ ${o.status}</div>
</div>`).join("")
:`<div class="card empty"><div style="font-size:50px">📦</div><h2>No orders yet</h2></div>`;

return `${header()}<div class="container">
<h1 class="pageTitle">📦 My Orders</h1>${html}</div>`
}

function profilePage(){
return `${header()}<div class="container">
<h1 class="pageTitle">👤 Profile</h1>
<div class="profile">
<div class="avatar">👤</div>
<h2>My Profile</h2>
<input class="field" id="pname" value="${profile.name}" placeholder="Your name">
<input class="field" id="pphone" value="${profile.phone}" placeholder="Mobile number">
<input class="field" id="paddress" value="${profile.address}" placeholder="Delivery address">
<button class="save" onclick="saveProfile()">Save Profile</button>
</div></div>`
}

function showPage(page){
document.querySelectorAll(".nav").forEach(x=>x.classList.remove("active"));
let nav=document.getElementById("n-"+page);
if(nav)nav.classList.add("active");

if(page==="home")document.getElementById("app").innerHTML=home();
if(page==="categories")document.getElementById("app").innerHTML=categories();
if(page==="cart")document.getElementById("app").innerHTML=cartPage();
if(page==="orders")document.getElementById("app").innerHTML=ordersPage();
if(page==="profile")document.getElementById("app").innerHTML=profilePage();

window.scrollTo(0,0)
}

function addCart(id){
let x=cart.find(i=>i.id==id);
if(x)x.qty++;
else cart.push({id:id,qty:1});
save();
showPage("cart");
}

function changeQty(id,n){
let x=cart.find(i=>i.id==id);
if(x){
x.qty+=n;
if(x.qty<=0)cart=cart.filter(i=>i.id!=id);
}
save();
showPage("cart");
}

function removeCart(id){
cart=cart.filter(i=>i.id!=id);
save();
showPage("cart");
}

function checkout(){
if(!profile.address){
alert("Please add delivery address in Profile.");
showPage("profile");
return
}
let total=cart.reduce((sum,i)=>{
let p=products.find(x=>x.id==i.id);
return sum+p.price*i.qty
},0);

let order={
id:"KA27"+Date.now().toString().slice(-10),
date:new Date().toLocaleDateString("en-IN"),
total:total,
status:"Order Placed"
};

orders.unshift(order);
cart=[];
save();

alert("✅ Order placed successfully!");
showPage("orders");
}

function saveProfile(){
profile={
name:document.getElementById("pname").value,
phone:document.getElementById("pphone").value,
address:document.getElementById("paddress").value
};
localStorage.setItem("ka27profile",JSON.stringify(profile));
alert("✅ Profile saved!");
}

function filterCat(cat){
let found=products.filter(p=>p.cat==cat);
document.getElementById("app").innerHTML=`
${header()}
<div class="container">
<h1 class="pageTitle">${cat}</h1>
<div class="products">${found.map(productCard).join("")}</div>
</div>`;
}

function searchProducts(q){
q=q.toLowerCase();
let found=products.filter(p=>
p.name.toLowerCase().includes(q)||
p.cat.toLowerCase().includes(q)
);

let box=document.getElementById("searchResults");
if(!box)return;

box.innerHTML=found.length?
found.map(productCard).join(""):
`<div class="empty">No products found.</div>`;
}

function openAI(){
document.getElementById("modal").style.display="flex";
document.getElementById("modalContent").innerHTML=`
<button class="close" onclick="closeModal()">✕</button>
<h2>🤖 KA27 AI</h2>
<div class="chat" id="chat">
<div class="msg bot">Namaste! 👋 Main KA27 AI hoon. Shopping mein help karunga.</div>
</div>
<div class="chatInput">
<input id="aiInput" placeholder="Ask anything...">
<button onclick="sendAI()">Send</button>
</div>`;
}

function aiQuestion(q){
openAI();
setTimeout(()=>{
document.getElementById("aiInput").value=q;
sendAI();
},100)
}

function sendAI(){
let input=document.getElementById("aiInput");
let q=input.value.trim();
if(!q)return;

let chat=document.getElementById("chat");
chat.innerHTML+=`<div class="msg user">${q}</div>`;

let answer="Aapke budget ke liye main Grocery aur daily-use products recommend karunga.";

if(q.toLowerCase().includes("budget"))
answer="Budget mein Premium Rice ₹499, Toor Dal ₹159 aur Sugar 5 KG ₹240 achhe options hain.";

if(q.toLowerCase().includes("grocery"))
answer="Grocery ke liye Rice, Dal, Oil aur Sugar available hain. Aap Cart mein add kar sakte ho.";

if(q.toLowerCase().includes("shoe"))
answer="Running Shoes ₹899 mein available hain.";

if(q.toLowerCase().includes("shirt"))
answer="Men T-Shirt ₹399 mein available hai.";

if(q.toLowerCase().includes("best"))
answer="Popular picks: Premium Rice, Men T-Shirt, Running Shoes aur Smart Watch.";

chat.innerHTML+=`<div class="msg bot">${answer}</div>`;
chat.scrollTop=chat.scrollHeight;
input.value="";
}

function closeModal(e){
if(!e||e.target.id==="modal")
document.getElementById("modal").style.display="none";
}

showPage("home");
</script>

</body>
</html>
